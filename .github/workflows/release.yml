name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node scripts/ci/repository.mjs --release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
  test:
    needs: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  images:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      base: ${{ steps.names.outputs.base }}
      backend: ${{ steps.backend.outputs.digest }}
      frontend: ${{ steps.frontend.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: names
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "base=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.base }}-backend:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=Lizhi Study Backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - id: frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          platforms: linux/amd64
          tags: ${{ steps.names.outputs.base }}-frontend:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.title=Lizhi Study Frontend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
  publish:
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci && npm run build
      - run: node scripts/ci/release-assets.mjs
        env:
          IMAGE_BASE: ${{ needs.images.outputs.base }}
          BACKEND_DIGEST: ${{ needs.images.outputs.backend }}
          FRONTEND_DIGEST: ${{ needs.images.outputs.frontend }}
      - name: Publish release at the verified tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          node scripts/ci/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
          if ! gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --draft \
              --title "栗知自习室 / Lizhi Study $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" --repo "$REPOSITORY" artifacts/release-"$RELEASE_TAG"/* --clobber
          gh release edit "$RELEASE_TAG" --repo "$REPOSITORY" --draft=false --latest
